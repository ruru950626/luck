<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星語日誌 | 今日運勢</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#49356c 0%,#1c1738 48%,#100e23 100%);color:#f5edff;font-family:system-ui,sans-serif}#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}#stars i{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite alternate}@keyframes twinkle{to{opacity:.15}}main{position:relative;max-width:780px;margin:auto;padding:40px 20px 60px}header{text-align:center;margin-bottom:28px}.moon{font-size:65px;color:#ffe1a1;text-shadow:0 0 35px #e8b9ff}h1{font-weight:500;letter-spacing:.24em;font-size:38px;margin:6px 0}p{line-height:1.7;color:#cbbede}.eyebrow{font-size:12px;letter-spacing:.35em;color:#e1c6a1}.panel{background:#ffffff09;border:1px solid #d8bdff40;border-radius:24px;padding:25px;backdrop-filter:blur(10px);box-shadow:0 15px 50px #09051b55}label{display:block;margin:0 0 8px;color:#e6d8fa;font-size:14px}input{width:100%;padding:14px;border:1px solid #b6a1d34d;border-radius:12px;background:#100e2555;color:#fff;font:inherit;color-scheme:dark}form{display:grid;grid-template-columns:1fr 1fr;gap:18px}button{grid-column:1/-1;border:0;border-radius:14px;padding:15px;background:linear-gradient(110deg,#e0c1ff,#a8a0f9);color:#25163e;font:inherit;font-weight:700;cursor:pointer;transition:.2s}button:hover{filter:brightness(1.12);transform:translateY(-2px)}#result{margin-top:24px}#result[hidden]{display:none}.hero{text-align:center}.score{font-size:64px;color:#f7dba5;font-weight:300;line-height:1.2}.score small{font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.tile{border:1px solid #d8bdff26;border-radius:16px;padding:16px;background:#ffffff08}.tile h3{margin:0 0 8px;font-size:15px;font-weight:500}.bar{height:6px;background:#ffffff19;border-radius:10px;overflow:hidden;margin:10px 0}.bar b{display:block;height:100%;background:linear-gradient(90deg,#9575dc,#eac5ff);border-radius:10px}.tile p{font-size:13px;margin:8px 0 0}.lucky{display:flex;justify-content:space-around;gap:10px;text-align:center;margin-top:22px}.lucky strong{display:block;margin-top:10px;color:#f7dba5}.dot{display:inline-block;width:15px;height:15px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid #fff8}.quote{text-align:center;border-top:1px solid #ffffff20;margin-top:24px;padding-top:20px;color:#f3d6ab}footer{text-align:center;font-size:12px;color:#a89bbd;margin-top:24px}@media(max-width:500px){form,.grid{grid-template-columns:1fr}h1{font-size:30px}.panel{padding:18px}}
</style></head><body><div id="stars" aria-hidden="true"></div><main><header><div class="moon">☾</div><div class="eyebrow">YOUR DAILY COSMIC GUIDE</div><h1>星語日誌</h1><p id="date"></p><p>讓星光為今天留下一封小小的信。</p></header><section class="panel"><form id="form"><div><label for="name">你的名字</label><input id="name" placeholder="輸入姓名或暱稱" required maxlength="40"></div><div><label for="birth">出生日期</label><input type="date" id="birth" required min="1900-01-01"></div><button type="submit">✧ 揭開今日運勢 ✧</button></form></section><section id="result" class="panel" hidden aria-live="polite"><div class="hero"><div class="eyebrow" id="sign"></div><h2 id="greet"></h2><div class="score" id="score"></div><p id="overall"></p></div><div class="grid" id="grid"></div><div class="lucky"><div>幸運色<strong id="color"></strong></div><div>幸運數字<strong id="number"></strong></div><div>幸運時段<strong id="hour"></strong></div></div><div class="quote" id="quote"></div></section><footer>✦ 本網站為娛樂用途，運勢由日期與輸入資料產生，並非科學預測。<br>資料僅在瀏覽器內運算，不會上傳。</footer></main><script>
const $=id=>document.getElementById(id);function day(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function refresh(){ $('date').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('birth').max=day()}refresh();for(let i=0;i<95;i++){let s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;opacity:${.3+Math.random()*.7};animation-delay:${Math.random()*3}s`;$('stars').append(s)}
function zodiac(b){let [y,m,d]=b.split('-').map(Number);let signs=['摩羯座 ♑','水瓶座 ♒','雙魚座 ♓','牡羊座 ♈','金牛座 ♉','雙子座 ♊','巨蟹座 ♋','獅子座 ♌','處女座 ♍','天秤座 ♎','天蠍座 ♏','射手座 ♐'];return signs[(m-1+(d>=[20,19,21,20,21,22,23,23,23,24,23,22][m-1]?1:0))%12]}
function rng(s){let h=2166136261;for(let c of s){h=Math.imul(h^c.codePointAt(0),16777619)}return ()=>{h=(h+0x6D2B79F5)|0;let t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296}}
const categories=[['♡ 愛情運勢',['適合留一點時間整理自己的感受。','真誠的交流比猜測更有幫助。','試著主動表達欣賞，為關係增添溫度。']],['✦ 財運',['購物前先想想是否真的需要。','適合整理預算與近期支出。','可以檢視儲蓄目標，給自己一點前進的動力。']],['☽ 學業與事業',['先完成最小的一件事，找回節奏。','將待辦事項分段，效率會更穩定。','適合發揮創意，嘗試新的解題方式。']],['❋ 健康運勢',['別忘記休息，安排一點放鬆時間。','喝水、規律吃飯，照顧日常需求。','適度伸展或散步，享受自己的節奏。']]];const colors=[['薰衣草紫','#bba1e4'],['月光白','#fff4dc'],['霧玫瑰粉','#db9fab'],['海鹽藍','#8eb8d8'],['鼠尾草綠','#9eb99a'],['琥珀金','#e9bd74']];const quotes=['不必一次照亮整條路，先照亮腳下就好。','今天的你，可以按照自己的速度前進。','把時間留給真正重要的事。','小小的勇氣，也能讓日常有新的方向。','允許自己休息，也允許自己重新開始。'];
$('form').addEventListener('submit',e=>{e.preventDefault();refresh();let name=$('name').value.trim();if(!name){$('name').focus();return}let birth=$('birth').value;if(birth>day())return;let r=rng(name.normalize('NFC')+'|'+birth+'|'+day());let scores=categories.map(()=>55+Math.floor(r()*46));let total=Math.round(scores.reduce((a,b)=>a+b,0)/4);$('sign').textContent=zodiac(birth);$('greet').textContent=name+'，這是你的今日星語';$('score').innerHTML=total+'<small> / 100</small>';$('overall').textContent=total>=85?'今日主題：勇敢探索，享受新的可能。':total>=70?'今日主題：穩定前進，留心生活中的小美好。':'今日主題：放慢步調，給自己多一點空間。';$('grid').innerHTML=categories.map(([title,msg],i)=>`<article class="tile"><h3>${title} · ${scores[i]} 分</h3><div class="bar"><b style="width:${scores[i]}%"></b></div><p>${msg[scores[i]>=85?2:scores[i]>=70?1:0]}</p></article>`).join('');let c=colors[Math.floor(r()*colors.length)];$('color').innerHTML=`<span class="dot" style="background:${c[1]}"></span>${c[0]}`;$('number').textContent=1+Math.floor(r()*99);$('hour').textContent=['09:00–11:00','11:00–13:00','14:00–16:00','17:00–19:00','20:00–22:00'][Math.floor(r()*5)];$('quote').textContent='「'+quotes[Math.floor(r()*quotes.length)]+'」';$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'start'})});
</script></body></html>
